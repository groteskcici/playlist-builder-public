[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playlist-builder"
version = "0.1.0"
description = "Automated Spotify SEO playlist builder"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0.0",
    "scrapling[fetchers]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
playlist_builder = ["ai/codex_schemas/*.json"]
